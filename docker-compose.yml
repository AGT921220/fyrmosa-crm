networks:
  appnetwork:

volumes:
  mysql_data:
  redis_data:

services:

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-crm
    restart: unless-stopped
    ports:
      - "${PORT_NGINX:-8090}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/logs:/var/log/nginx
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      - php
    networks:
      - appnetwork

  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
    container_name: php-crm
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: "false"
    container_name: horizon-crm
    restart: unless-stopped
    command: php artisan horizon
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: "false"
    container_name: scheduler-crm
    restart: unless-stopped
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  mysql:
    image: mysql:8.4
    container_name: mysql-crm
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "${PORT_MYSQL:-4310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - appnetwork

  redis:
    image: redis:8-alpine
    container_name: redis-crm
    restart: unless-stopped
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks:
      - appnetwork

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma-crm
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "${PORT_PHPMYADMIN:-8091}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnetwork
